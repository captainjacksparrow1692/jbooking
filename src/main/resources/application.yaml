spring:
  application:
    name: jbooking

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/jbooking}
    username: ${DB_USERNAME:sparrow}
    password: ${DB_PASSWORD:9376570167}
    driver-class-name: org.postgresql.Driver
    tomcat:
      test-on-borrow: true
      validation-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        jdbc:batch_size: 20я
        order_updates: true
        order_inserts: true
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:public}
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true

server:
  port: ${SERVER_PORT:8081}
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types: application/json, text/plain

# Kafka
kafka:
  bootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  groupId: ${KAFKA_GROUP_ID:jbooking-group}
  clientId: ${KAFKA_CLIENT_ID:jbooking-client}
  acksConfig: ${KAFKA_ACKS_CONFIG:all}
  retriesConfig: ${KAFKA_RETRIES_CONFIG:3}
  batchSizeConfig: ${KAFKA_BATCH_SIZE_CONFIG:16384}
  lingerMsConfig: ${KAFKA_LINGER_MS_CONFIG:100}
  bufferMemoryConfig: ${KAFKA_BUFFER_MEMORY_CONFIG:32768}
  autoOffsetResetConfig: ${KAFKA_AUTO_OFFSET_RESET_CONFIG:earliest}
  clientDnsLookup: ${KAFKA_CLIENT_DNS_LOOKUP:use_all_dns_ips}
  topic:
    bookingCreated: ${KAFKA_TOPIC_BOOKING_CREATED:jbooking.bookings.created}
    paymentStatus: ${KAFKA_TOPIC_PAYMENT_STATUS:jbooking.payments.status}
    notifications: ${KAFKA_TOPIC_NOTIFICATIONS:jbooking.internal.notifications}

# REST clients
rest-client:
  readTimeoutOfMillis: ${REST_READ_TIMEOUT:5000}
  connectionTimeoutOfMillis: ${REST_CONNECT_TIMEOUT:5000}
  jbankUrl: ${JBANK_URL:http://localhost:8082}
  jnotificationUrl: ${JNOTIFICATION_URL:http://localhost:8083}