spring:
  application:
    name: jbooking

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/jbooking}
    username: ${DB_USERNAME:sparrow}
    password: ${DB_PASSWORD:9376570167}
    driver-class-name: org.postgresql.Driver
    tomcat:
      test-on-borrow: true
      validation-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_updates: true
        order_inserts: true
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:public}
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Параметры как у ментора (Eugene7007/delivery)
    consumer:
      group-id: ${KAFKA_GROUP_ID:${spring.application.name}}
      client-id: ${KAFKA_CLIENT_ID:${spring.application.name}-consumer}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "uzumtech.jbooking.dto.event"
    producer:
      acks: ${KAFKA_ACKS:all}
      retries: ${KAFKA_RETRIES:3}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        linger.ms: ${KAFKA_LINGER_MS:100}
        batch.size: ${KAFKA_BATCH_SIZE:16384}
        buffer.memory: ${KAFKA_BUFFER_MEMORY:32768}
        client.dns.lookup: ${KAFKA_CLIENT_DNS_LOOKUP:use_all_dns_ips}

server:
  port: ${SERVER_PORT:8081}
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types: application/json, text/plain
